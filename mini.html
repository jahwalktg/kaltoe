<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>칼퇴 작은 창</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="app.css?v=6">
<link rel="stylesheet" href="mini.css?v=2">
</head>
<body class="mini-win">
<div id="m"></div>
<script src="tools.js?v=6"></script>
<script src="mini.js?v=2"></script>
<script>
(function () {
  var t = KTMini.get('themeMode', ''); try { t = localStorage.getItem('kaltoe.theme') || ''; } catch (e) {}
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  KTMini.mount(document.getElementById('m'), { open: function (id) {
    var o = window.opener;
    try { if (o && !o.closed && o.KT_OPEN) { o.KT_OPEN(id); o.focus(); return; } } catch (e) {}
    window.open('./index.html#' + id, 'kaltoe-main');
  } });
})();
</script>
</body>
</html>
