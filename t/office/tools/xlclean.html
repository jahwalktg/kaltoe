<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표 청소기 — 칼퇴용 뚝딱 사무도구</title>


<link rel="stylesheet" href="../style.css?v=2">
<style>
.lay{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;align-items:start}
.opt{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.opt:last-child{border-bottom:0}
.opt input{margin-top:4px}
.opt .c{margin-left:auto;white-space:nowrap;font-size:.8rem;color:var(--muted)}
.opt .c.hot{color:var(--ok);font-weight:700}
.opt small{display:block;color:var(--muted);font-size:.8rem}
.fills{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.pv{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pv table{border-collapse:collapse;font-size:.8rem;background:#fff;color:#111;white-space:nowrap}
.pv th,.pv td{border:1px solid #bbb;padding:2px 6px}
.pv th{background:#e7e6e6;position:sticky;top:0;z-index:1}
.pv td.ch{background:#fff3b0}
.pv td.n{text-align:right}
.legend{display:inline-block;width:14px;height:14px;background:#fff3b0;border:1px solid #bbb;vertical-align:middle;margin-right:4px}
@media (max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}}
</style>
<link rel="stylesheet" href="../../../frame.css">
<script src="../../../frame.js"></script>
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <p class="sub">보고서용으로 꾸민 엑셀 표(합친 칸·중간 합계·글자로 된 숫자)는 거르기·정렬·합계가 안 됩니다. <b>항목을 고르면 깨끗한 표로 바꿔</b> 엑셀로 돌려 드립니다. 원래 파일은 그대로 둡니다.</p>
  <section class="panel" style="margin-top:12px">
    <div class="step"><span class="n">1</span><h2>표 넣기</h2></div>
    <div id="pick"></div>
  </section>
  <div class="lay" id="work" hidden>
    <section class="panel">
      <div class="step"><span class="n">2</span><h2>무엇을 고칠까요</h2></div>
      <div id="opts"></div>
    </section>
    <section class="panel">
      <div class="step"><span class="n">3</span><h2>미리 보기 · 받기</h2><span class="hint" id="sum"></span></div>
      <p class="hint" style="margin-top:0"><span class="legend"></span>바뀐 칸 · 앞 80줄만 보입니다</p>
      <div class="pv" id="pv"></div>
      <div class="row" style="margin-top:10px">
        <label class="f" style="min-width:200px">파일 이름<input type="text" id="fname" value="정리한 표"></label>
        <button type="button" class="btn main" id="dl">정리한 엑셀 받기</button>
        <button type="button" class="btn" id="copy">표 복사</button>
      </div>
      <p class="hint">받은 엑셀은 머리글이 고정되고 거르기 단추가 달려 있어 바로 정렬·거르기·피벗을 할 수 있습니다. 「표 복사」는 엑셀·한글·구글 시트에 붙여 넣을 때.</p>
    </section>
  </div>
  
</div>
<script src="../../../lib/xlsx.full.min.js"></script>
<script src="../lib/hwpx.js?v=1"></script>
<script src="../lib/xlsxw.js?v=3"></script>
<script src="../core.js?v=7"></script>
<script src="../lib/xlkit.js?v=1"></script>
<script>
(function () {
  var O = Office, $ = O.$, esc = O.esc, K = XK;
  O.header('xlclean');
  var src = null, fills = {}, last = null;
  var OPTS = [
    { k: 'merge', on: 1, t: '합친 칸 풀고 같은 값 채우기', s: '세로로 합친 「부서」 칸 등 — 줄마다 값이 있어야 거르기가 됩니다' },
    { k: 'head2', on: 1, t: '두 줄 머리글을 한 줄로', s: '「참여기간」 아래 「시작일」 → 「참여기간 시작일」 (머리글 줄에 합친 칸이 있을 때)' },
    { k: 'top', on: 1, t: '머리글 위 제목 줄 빼기', s: '맨 위 「○○ 현황」·「(단위: 원)」 같은 줄' },
    { k: 'emptyRow', on: 1, t: '빈 줄 빼기' },
    { k: 'emptyCol', on: 1, t: '빈 칸(열) 빼기' },
    { k: 'sum', on: 1, t: '합계·소계·계 줄 빼기', s: '줄 첫 글자가 합계·소계·총계·계인 줄' },
    { k: 'rehead', on: 1, t: '중간에 되풀이된 머리글 줄 빼기', s: '쪽마다 머리글이 다시 나오는 인쇄용 표' },
    { k: 'space', on: 1, t: '띄어쓰기·줄바꿈 정리', s: '앞뒤 띄어쓰기, 두 칸 띄어쓰기, 칸 안 줄바꿈 → 한 칸' },
    { k: 'date', on: 1, t: '글자로 된 날짜 → 날짜', s: '2026.1.5 · 2026-01-05 · 2026년 1월 5일 · 26.01.05 (날짜 칸이면 20260105도)' },
    { k: 'num', on: 1, t: '글자로 된 숫자 → 숫자', s: '「1,234」「1,234원」「25%」「(1,200)」 — 앞자리 0(계좌·전화·주민번호)은 그대로 글자' },
    { k: 'fill', on: 1, t: '빈칸을 바로 위 값으로 채울 칸', s: '합치지 않고 첫 줄에만 적어 둔 칸(예: 부서). 고른 칸만 채웁니다', list: 1 },
    { k: 'dup', on: 0, t: '완전히 같은 줄 빼기', s: '모든 칸이 똑같은 줄은 하나만 남김' }
  ];
  var on = {}; OPTS.forEach(function (o) { on[o.k] = !!o.on; });
  K.picker($('pick'), { onData: function (d) { src = d; fills = {}; if (d) suggestFill(); $('work').hidden = !d; if (d) run(); }, sample: sample });

  function cl(x) { return x ? { v: x.v, t: x.t, z: x.z, w: x.w } : null; }
  function isDateHead(n) { return /일자|날짜|일시|생년월일|시작일|종료일|입사일|퇴사일|date|\d월\d일|일$/i.test(n.replace(/\s/g, '')); }
  /* ---------- 정리 ---------- */
  function clean() {
    var g = src.g.map(function (r) { return r.map(cl); }), h = src.h, cnt = {}, ch = {}, H = g.length, W = (g[0] || []).length;
    OPTS.forEach(function (o) { cnt[o.k] = 0; });
    var mark = function (r, c, k) { ch[r + ',' + c] = 1; cnt[k]++; };
    // 두 줄 머리글? (머리글 줄에 합친 칸이 있고 바로 아래 줄이 숫자 없는 글자 줄)
    var low = g[h + 1] || [], lowT = low.map(function (x) { return K.txt(x); });
    var two = on.head2 && src.merges.some(function (m) { return m.r === h && (m.cs > 1 || m.rs > 1); }) && lowT.some(Boolean) && !lowT.some(function (t) { return t && K.num(t) != null; });
    var hb = two ? h + 1 : h;
    // 1) 합친 칸 풀기 (본문만 표시)
    if (on.merge) src.merges.forEach(function (m) { var top = g[m.r] && g[m.r][m.c]; if (!top || m.r <= hb && m.r + m.rs - 1 <= hb) return; for (var i = 0; i < m.rs; i++) for (var j = 0; j < m.cs; j++) if ((i || j) && g[m.r + i] && m.c + j < W && m.r + i > hb) { g[m.r + i][m.c + j] = cl(top); mark(m.r + i, m.c + j, 'merge'); } });
    // 2) 머리글 이름 (두 줄이면 합침)
    var head = K.headNames(g, h);
    if (two) {
      var upT = []; for (var c0 = 0; c0 < W; c0++) upT[c0] = K.txt(g[h][c0]);
      src.merges.forEach(function (m) { if (m.r === h) for (var j = 1; j < m.cs; j++) if (!upT[m.c + j]) upT[m.c + j] = upT[m.c]; });
      var seen = {};
      head = upT.map(function (u, c) { var lw = lowT[c], n; if (u && lw && u !== lw) { cnt.head2++; n = u + ' ' + lw; } else n = u || lw || ('칸' + (c + 1)); if (seen[n]) { seen[n]++; n += '(' + seen[n] + ')'; } else seen[n] = 1; return n; });
    }
    cnt.top = on.top ? g.slice(0, h).filter(function (r) { return !K.rowEmpty(r); }).length : 0;
    // 3) 줄 고르기
    var hk = K.headNames(g, h).map(K.keyOf).join('|'), hk2 = two ? lowT.map(function (t, c) { return K.keyOf(t || K.txt(g[h][c]) || ('칸' + (c + 1))); }).join('|') : hk, rows = [], drop = { emptyRow: 0, sum: 0, rehead: 0, dup: 0 };
    for (var r = hb + 1; r < H; r++) {
      var row = g[r];
      if (K.rowEmpty(row)) { if (on.emptyRow) { drop.emptyRow++; continue; } }
      else {
        var first = row.filter(function (x) { return K.txt(x); })[0];
        if (on.sum && first && K.SUMRE.test(K.txt(first).replace(/\s/g, ''))) { drop.sum++; continue; }
        var rk = 0; if (on.rehead && (rk = row.map(function (x, i) { return K.keyOf(K.txt(x) || ('칸' + (i + 1))); }).join('|')) && (rk === hk || rk === hk2)) { drop.rehead++; continue; }
      }
      rows.push({ r: r, cells: row });
    }
    // 4) 위 값으로 채우기
    if (on.fill) Object.keys(fills).forEach(function (c) { if (!fills[c]) return; c = +c; var prev = null; rows.forEach(function (o) { var x = o.cells[c]; if (K.txt(x)) prev = x; else if (prev && !K.rowEmpty(o.cells)) { o.cells[c] = cl(prev); mark(o.r, c, 'fill'); } }); });
    // 5) 칸 내용 고치기
    rows.forEach(function (o) {
      o.cells.forEach(function (x, c) {
        if (!x || x.t === 'n' || x.t === 'b') return;
        var s = String(x.w != null ? x.w : x.v);
        if (on.space) { var s2 = s.replace(/ /g, ' ').replace(/\s*[\r\n]+\s*/g, ' ').replace(/[ \t]{2,}/g, ' ').trim(); if (s2 !== s) { s = s2; o.cells[c] = x = { v: s, t: 's', w: s }; mark(o.r, c, 'space'); } if (!s) { o.cells[c] = null; return; } }
        if (on.date) { var ds = (/^\d{8}$/.test(s) && !isDateHead(head[c] || '')) ? null : K.dateSerial(s); if (ds != null) { o.cells[c] = { v: ds, t: 'n', z: 'yyyy-mm-dd', w: s }; mark(o.r, c, 'date'); return; } }
        if (on.num) { var v = K.num(s); if (v != null && !/^\d{8}$/.test(s)) { o.cells[c] = { v: v, t: 'n', z: /%/.test(s) ? (/\.\d/.test(s) ? '0.00%' : '0%') : /,/.test(s) ? '#,##0' : 'General', w: s }; mark(o.r, c, 'num'); } }
      });
    });
    // 6) 같은 줄 빼기
    if (on.dup) { var seenR = {}; rows = rows.filter(function (o) { var k = o.cells.map(function (x) { return x ? String(x.v) : ''; }).join('\u0001'); if (seenR[k]) { drop.dup++; return false; } seenR[k] = 1; return true; }); }
    // 7) 빈 칸 빼기
    var keep = []; for (var c2 = 0; c2 < W; c2++) { var used = rows.some(function (o) { return K.txt(o.cells[c2]); }) || (K.txt(g[h][c2]) && !on.emptyCol); if (used || !on.emptyCol) keep.push(c2); }
    cnt.emptyCol = W - keep.length;
    Object.keys(drop).forEach(function (k) { cnt[k] = drop[k]; });
    return { head: keep.map(function (c) { return head[c]; }), rows: rows.map(function (o) { return { r: o.r, cells: keep.map(function (c) { return o.cells[c]; }) }; }), keep: keep, ch: ch, cnt: cnt };
  }
  /* 빈칸 채울 칸 추천: 글자 칸인데 빈칸이 20% 넘고, 값이 나온 뒤 빈칸이 이어지는 칸 */
  function suggestFill() {
    var g = src.g, h = src.h, hn = K.headNames(g, h);
    hn.forEach(function (n, c) {
      var body = g.slice(h + 1).filter(function (r) { return !K.rowEmpty(r); }), vals = body.map(function (r) { return K.txt(r[c]); });
      var f0 = vals.findIndex(Boolean); if (f0 < 0) { fills[c] = false; return; } vals = vals.slice(f0);
      var filled = vals.filter(Boolean), blanks = vals.length - filled.length;
      var texty = filled.filter(function (t) { return K.num(t) == null && K.dateSerial(t) == null; }).length > filled.length * .7;   // 숫자·날짜 칸은 빈칸이 뜻이 있으므로 추천 안 함
      var vMerged = src.merges.some(function (m) { return m.c === c && m.rs > 1 && m.r > h; });
      var groupy = !/비고|메모|특이|내용|사유|설명|주소|연락처|전화|성명|이름|생년/.test(n) && (c <= 1 || /사업단|부서|팀|구분|기관|지점|점포|분류|소속|유형|과$|반$/.test(n));   // 비고 같은 자유 글은 채우지 않음
      fills[c] = texty && groupy && (vMerged || (filled.length >= 2 && blanks >= vals.length * .2 && blanks < vals.length * .9));
    });
  }
  function renderOpts(res) {
    var hn = K.headNames(src.g, src.h);
    $('opts').innerHTML = OPTS.map(function (o) {
      var n = res.cnt[o.k] || 0, unit = /Row|sum|rehead|dup|top/.test(o.k) ? '줄' : o.k === 'emptyCol' ? '칸(열)' : o.k === 'head2' ? '칸' : '칸';
      return '<label class="opt"><input type="checkbox" data-o="' + o.k + '"' + (on[o.k] ? ' checked' : '') + '><span>' + o.t + (o.s ? '<small>' + o.s + '</small>' : '') +
        (o.list ? '<span class="fills">' + hn.map(function (nm, c) { return '<label class="chk" style="font-size:.82rem"><input type="checkbox" data-fill="' + c + '"' + (fills[c] ? ' checked' : '') + '> ' + esc(nm) + '</label>'; }).join('') + '</span>' : '') +
        '</span><span class="c' + (on[o.k] && n ? ' hot' : '') + '">' + (on[o.k] ? (n ? n + unit : '해당 없음') : '') + '</span></label>';
    }).join('');
    $('opts').querySelectorAll('[data-o]').forEach(function (c) { c.onchange = function () { on[c.dataset.o] = c.checked; run(); }; });
    $('opts').querySelectorAll('[data-fill]').forEach(function (c) { c.onclick = function (e) { e.stopPropagation(); }; c.onchange = function () { fills[c.dataset.fill] = c.checked; run(); }; });
  }
  function show(x) { if (!x) return ''; if (x.t === 'n') { if (x.z && XLSX.SSF.is_date(x.z)) return XLSX.SSF.format('yyyy-mm-dd', x.v); if (/%/.test(x.z || '')) return XLSX.SSF.format(x.z, x.v); return /[#0],/.test(x.z || '') ? x.v.toLocaleString() : String(x.v); } return String(x.w != null ? x.w : x.v); }
  function run() {
    if (!src) return;
    var res = clean(); last = res; renderOpts(res);
    var h = '<table><tr>' + res.head.map(function (n) { return '<th>' + esc(n) + '</th>'; }).join('') + '</tr>';
    res.rows.slice(0, 80).forEach(function (o) { h += '<tr>' + o.cells.map(function (x, i) { var c = res.keep[i], cls = (res.ch[o.r + ',' + c] ? 'ch ' : '') + (x && x.t === 'n' ? 'n' : ''); return '<td class="' + cls + '">' + esc(show(x)) + '</td>'; }).join('') + '</tr>'; });
    $('pv').innerHTML = h + '</table>';
    var total = Object.keys(res.cnt).reduce(function (a, k) { return a + (on[k] ? res.cnt[k] : 0); }, 0);
    $('sum').textContent = '정리 뒤 ' + res.rows.length + '줄 × ' + res.head.length + '칸 · 고친 곳 ' + total;
    if (src.name && $('fname').value === '정리한 표') $('fname').value = src.name + '_정리';
  }
  $('dl').onclick = function () {
    if (!last) return;
    var body = last.rows.map(function (o) { return o.cells.map(K.outCell); });
    O.download(K.fileSafe($('fname').value || '정리한 표') + '.xlsx', Xlsxw.book(K.bookSheet('정리한 표', last.head, body))); O.toast('정리한 엑셀을 내려받았습니다.');
  };
  $('copy').onclick = function () {
    if (!last) return;
    var plain = [last.head.join('\t')].concat(last.rows.map(function (o) { return o.cells.map(function (x) { return show(x).replace(/\t/g, ' '); }).join('\t'); })).join('\n');
    var html = '<table border="1" style="border-collapse:collapse"><tr>' + last.head.map(function (n) { return '<th style="background:#e7e6e6">' + esc(n) + '</th>'; }).join('') + '</tr>' + last.rows.map(function (o) { return '<tr>' + o.cells.map(function (x) { return '<td' + (x && x.t === 'n' ? ' style="text-align:right"' : '') + '>' + esc(show(x)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
    K.copyHtml(html, plain);
  };
  function sample() {
    return K.aoaFile('부서별 근무 현황(예시).xlsx', [
      ['2026년 10월 부서별 참여 현황(예시)'], ['(단위: 원)'],
      ['부서', '성명', '참여기간', null, '급여', '비고'],
      [null, null, '시작일', '종료일', null, null],
      ['가나팀', ' 김하늘 ', '2026.1.5', '2026.12.31', '1,534,000', ''],
      [null, '이바다', '2026.3.2', '2026.12.31', '1,388,000원', '팀장'],
      [null, '박구름', '2026-07-01', '', '1,607,000', ''],
      ['소계', null, null, null, '4,529,000', null],
      ['다라팀', '최별', '26.02.02', '', '1,461,000', '전화 010-1234-5678'],
      ['', '정  나무', '2026년 4월 1일', '', '(12,000)', '정산 환수'],
      [null, null, null, null, null, null],
      ['부서', '성명', '시작일', '종료일', '급여', '비고'],
      ['마바팀', '한들꽃', '2026.5.6', '', '1,534,000', '계좌 0123-45-678'],
      ['합계', null, null, null, '7,512,000', null]
    ], function (ws) { ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } }, { s: { r: 2, c: 0 }, e: { r: 3, c: 0 } }, { s: { r: 2, c: 1 }, e: { r: 3, c: 1 } }, { s: { r: 2, c: 2 }, e: { r: 2, c: 3 } }, { s: { r: 2, c: 4 }, e: { r: 3, c: 4 } }, { s: { r: 2, c: 5 }, e: { r: 3, c: 5 } }, { s: { r: 4, c: 0 }, e: { r: 6, c: 0 } }]; });
  }
  window._clean = { clean: function () { return clean(); }, on: on, fills: fills };
})();
</script>
</body>
</html>
